# Service: ClusterIP
# Expõe pods internamente no cluster com load balancing
# Aplicar: kubectl apply -f 07-service.yaml
# Verificar: kubectl get svc -n karpenter-demo
# Testar: kubectl run -it --rm debug --image=curlimages/curl --restart=Never -- curl http://demo-api.karpenter-demo.svc.cluster.local:3000

---
# Service para Topology Deployment
apiVersion: v1
kind: Service
metadata:
  name: demo-api-topology
  namespace: karpenter-demo
  labels:
    app: demo-api
    version: topology

spec:
  # type: Tipo de service
  # ClusterIP: Expõe apenas internamente no cluster (default)
  # NodePort: Expõe em porta de cada nó
  # LoadBalancer: Provisiona load balancer externo (cloud)
  type: ClusterIP

  # clusterIP: IP interno do service
  # None = Headless Service (sem load balancing)
  # <vazio> = Kubernetes aloca IP automaticamente
  # <IP específico> = Usar IP específico (deve estar no serviceSubnet)
  # clusterIP: None  # Para StatefulSets
  # Deixar vazio para alocação automática

  # selector: Labels para selecionar pods backend
  # Service roteia tráfego para pods com estas labels
  selector:
    app: demo-api
    version: topology

  # ports: Lista de portas expostas
  ports:
    # Porta 1: HTTP
    - name: http
      # protocol: TCP ou UDP
      protocol: TCP
      # port: Porta do service (onde clientes conectam)
      port: 80
      # targetPort: Porta do container (onde aplicação escuta)
      targetPort: 3000
      # Pode ser número ou nome da porta do container
      # targetPort: http (se container define ports.name: http)

  # sessionAffinity: Sessão sticky (mesmo cliente → mesmo pod)
  # None: Sem afinidade, load balance aleatório (default)
  # ClientIP: Mesmo cliente vai sempre para mesmo pod
  sessionAffinity: None
  # Usar ClientIP para aplicações stateful ou com sessões

  # sessionAffinityConfig: Configurações de session affinity
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 horas

---
# Service para Affinity Deployment
apiVersion: v1
kind: Service
metadata:
  name: demo-api-affinity
  namespace: karpenter-demo
  labels:
    app: demo-api
    version: affinity

spec:
  type: ClusterIP
  selector:
    app: demo-api
    version: affinity
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  sessionAffinity: None

---
# Service para Anti-Affinity Deployment
apiVersion: v1
kind: Service
metadata:
  name: demo-api-anti-affinity
  namespace: karpenter-demo
  labels:
    app: demo-api
    version: anti-affinity
  # annotations: Metadados para integrações
  annotations:
    # Prometheus scraping
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"

spec:
  type: ClusterIP
  selector:
    app: demo-api
    version: anti-affinity
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    # Porta adicional: Métricas Prometheus
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 3000
  sessionAffinity: None

  # ipFamilyPolicy: Política de IP family (IPv4, IPv6, dual-stack)
  # SingleStack: Apenas uma família (default)
  # PreferDualStack: Prefere dual-stack mas aceita single
  # RequireDualStack: Requer dual-stack
  ipFamilyPolicy: SingleStack

  # ipFamilies: Famílias de IP explícitas
  # IPv4, IPv6
  ipFamilies:
    - IPv4

---
# Service: Unified (para todos deployments)
# Service único que roteia para TODOS os deployments
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: karpenter-demo
  labels:
    app: demo-api

spec:
  type: ClusterIP
  # Selector seleciona TODOS pods com label app=demo-api
  # Independente da versão (topology, affinity, anti-affinity)
  selector:
    app: demo-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  sessionAffinity: None

# Como Service funciona:

# 1. DNS Resolution
# Service cria entrada DNS automaticamente:
# - demo-api.karpenter-demo.svc.cluster.local → ClusterIP
# - demo-api.karpenter-demo → ClusterIP (short name)
# - demo-api → ClusterIP (se no mesmo namespace)

# 2. Load Balancing
# Service usa iptables/IPVS para distribuir tráfego:
#
# Client → Service IP (10.96.x.x)
#           ↓
#      kube-proxy (iptables rules)
#           ↓
#      Round-robin entre pods
#           ↓
#      Pod 1: 10.244.1.5:3000
#      Pod 2: 10.244.2.8:3000
#      Pod 3: 10.244.3.12:3000

# 3. Endpoints
# Service mantém lista de endpoints (pods) dinamicamente:
# kubectl get endpoints demo-api -n karpenter-demo
#
# Output:
# NAME        ENDPOINTS                                         AGE
# demo-api    10.244.1.5:3000,10.244.2.8:3000,10.244.3.12:3000  5m

# Se pod morre ou fica NotReady:
# - Automaticamente removido dos endpoints
# - Tráfego não é mais roteado para ele

# 4. Session Affinity (Sticky Sessions)
# Com sessionAffinity: ClientIP:
#
# Request 1: Cliente A (IP: 192.168.1.100) → Pod 1
# Request 2: Cliente A (IP: 192.168.1.100) → Pod 1 (mesmo pod)
# Request 3: Cliente B (IP: 192.168.1.101) → Pod 2
# Request 4: Cliente A (IP: 192.168.1.100) → Pod 1 (ainda mesmo pod)
#
# Útil para aplicações com estado em memória (sessões HTTP, websockets)

