# ...

# Tipos de Service:

# ClusterIP (este arquivo)
# - Expõe apenas internamente
# - Padrão para comunicação intra-cluster
# - Usa: APIs internas, databases, caches

# NodePort
# type: NodePort
# ports:
#   - port: 80
#     targetPort: 3000
#     nodePort: 30080  # Porta em cada nó (30000-32767)
# - Expõe em porta de TODOS os nós
# - Acesso: <NodeIP>:30080
# - Usa: Ambientes sem LoadBalancer (on-prem)

# LoadBalancer
# type: LoadBalancer
# - Provisiona load balancer externo (cloud)
# - Obtém IP público
# - Usa: Expor aplicação para internet

# ExternalName
# type: ExternalName
# externalName: api.example.com
# - Cria CNAME para serviço externo
# - Não tem selector, ports, clusterIP
# - Usa: Integração com serviços externos

# Headless Service
# clusterIP: None
# - Sem load balancing
# - DNS retorna IPs de TODOS pods
# - Usa: StatefulSets, descoberta de pods

# Melhores práticas:

# 1. Usar nomes significativos
# - demo-api-topology (específico por versão)
# - demo-api (agregado para todas versões)

# 2. Definir múltiplas portas quando necessário
# ports:
#   - name: http
#     port: 80
#   - name: https
#     port: 443
#   - name: metrics
#     port: 9090

# 3. Usar annotations para integrações
# annotations:
#   prometheus.io/scrape: "true"
#   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# 4. Monitor endpoints
# kubectl get endpoints -w -n karpenter-demo
# Identifica pods sendo adicionados/removidos

# 5. Testar DNS e conectividade
# Sempre validar que service está roteando corretamente
