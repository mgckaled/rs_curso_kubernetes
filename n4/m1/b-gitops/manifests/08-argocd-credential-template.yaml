# =============================================================================
# Credential Template - Reutilizacao de credenciais SSH
# Nivel 4 - Modulo 1 - Aula 10
# =============================================================================
#
# Problema: cada novo repositorio precisa ser registrado individualmente
# no Argo CD com suas credenciais. Isso NAO escala.
#
# Solucao: Credential Templates
#   - Define credenciais UMA VEZ por organizacao/usuario
#   - Todos os repositorios sob essa organizacao usam automaticamente
#   - Baseado em pattern matching da URL
#
# Exemplo:
#   Template para "git@github.com:mgckaled" cobre:
#   - git@github.com:mgckaled/repo1.git
#   - git@github.com:mgckaled/repo2.git
#   - git@github.com:mgckaled/repo-qualquer.git
#
# NOTA: Este manifest e um EXEMPLO/REFERENCIA.
# Para funcionar com SSH, voce precisa fornecer sua chave privada real.
# Para repositorios publicos via HTTPS, Credential Templates nao sao necessarios.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  # Nome descritivo do template
  name: cred-template-github-mgckaled
  namespace: argocd
  # Label que identifica este Secret como Credential Template
  # IMPORTANTE: "repo-creds" (nao "repository")
  # "repository" = repositorio individual
  # "repo-creds" = template reutilizavel
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  # Tipo de conexao
  type: git
  # URL BASE da organizacao/usuario (sem repositorio especifico)
  # Pattern matching: cobre todos os repos sob este path
  url: git@github.com:mgckaled
  # Chave SSH privada para autenticacao
  # IMPORTANTE: Substitua pelo conteudo real da sua chave privada
  # Gerar chave: ssh-keygen -t ed25519 -C "argocd" -f ~/.ssh/argocd_key
  # Adicionar chave publica no GitHub: Settings -> SSH Keys
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    SUBSTITUA_PELO_CONTEUDO_DA_SUA_CHAVE_PRIVADA
    -----END OPENSSH PRIVATE KEY-----
